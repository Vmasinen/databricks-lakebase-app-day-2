<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Watchlist & Vector Search</title>
  <style>
    :root {
      --gradient-start: #667eea;
      --gradient-end: #764ba2;
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: #ffffff;
      --border: #e0e0e0;
      --text: #333;
      --muted: #666;
      --accent: #667eea;
      --accent-hover: #5568d3;
      --danger: #ff4757;
      --danger-hover: #ee2f3f;
      --success: #10b981;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      margin: 40px 0 16px 0;
      color: var(--text);
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    .section {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 2px solid #f0f0f0;
    }
    .section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }
    label:first-child { margin-top: 0; }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      margin-top: 8px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      margin-top: 16px;
      padding: 12px 24px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .info-btn {
      padding: 6px 12px;
      margin: 0 8px 0 0;
      background: var(--accent);
      font-size: 14px;
      box-shadow: none;
    }
    .info-btn:hover {
      background: var(--accent-hover);
      transform: none;
      box-shadow: none;
    }

    .delete-btn {
      padding: 6px 12px;
      margin: 0;
      background: var(--danger);
      font-size: 14px;
      box-shadow: none;
    }
    .delete-btn:hover {
      background: var(--danger-hover);
      transform: none;
      box-shadow: none;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      min-height: 20px;
      font-size: 14px;
      background: #f0f4ff;
      border-left: 4px solid var(--accent);
      color: var(--text);
    }
    #result:empty { display: none; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 16px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    thead {
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    }
    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 12px;
      color: white;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text);
    }
    tbody tr:hover { background: #f8f9ff; }
    tbody tr:last-child td { border-bottom: none; }

    .empty-row td {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .price {
      font-weight: 600;
      color: var(--accent);
    }

    .company-name {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-content {
      background: white;
      margin: 5% auto;
      padding: 0;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideDown 0.3s;
    }
    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      padding: 24px 32px;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      color: white;
      border-radius: 16px 16px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      color: white;
      background: none;
      -webkit-text-fill-color: white;
    }
    .close {
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      transition: opacity 0.3s;
    }
    .close:hover { opacity: 0.7; }
    .modal-body { padding: 32px; }

    .stock-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 2px solid #f0f0f0;
    }
    .stock-logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: contain;
      background: #f8f9ff;
      padding: 8px;
    }
    .stock-info h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: var(--text);
    }
    .stock-info .exchange {
      color: var(--muted);
      font-size: 14px;
    }

    .info-section {
      margin-bottom: 24px;
    }
    .info-section h4 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .info-section p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .info-card {
      background: #f8f9ff;
      padding: 16px;
      border-radius: 8px;
    }
    .info-card .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .info-card .value {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }

    .news-item {
      padding: 16px;
      margin-bottom: 12px;
      background: #f8f9ff;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .news-item h5 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .news-item p {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .news-item .news-meta {
      font-size: 12px;
      color: #999;
    }
    .news-item a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .news-item a:hover { text-decoration: underline; }

    /* Search Result Styles */
    .search-result {
      background: #f8f9ff;
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .search-result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .search-result-id {
      font-weight: 600;
      color: var(--accent);
      font-size: 14px;
    }
    .search-result-score {
      background: var(--accent);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .search-result-text {
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .search-result-metadata {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
    }
    #search-results {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Stock Watchlist</h1>
  <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

  <div class="card">
    <form id="stock-form">
      <label for="symbol">Ticker symbol</label>
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </form>

    <div id="result"></div>
  </div>

  <div class="card">
    <table id="watchlist-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Email</th>
          <th>Latest price</th>
          <th>Updated</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="watchlist-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";

        if (!data.length) {
          const emptyTr = document.createElement("tr");
          emptyTr.className = "empty-row";
          emptyTr.innerHTML = `<td colspan="5">Your watchlist is empty. Add a ticker above to get started.</td>`;
          watchlistBody.appendChild(emptyTr);
          return;
        }

        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `
            <td>${row.symbol}</td>
            <td>${row.email || "-"}</td>
            <td>${price}</td>
            <td>${updated}</td>
            <td><button type="button" class="delete-btn" data-symbol="${row.symbol}">Remove</button></td>
          `;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    watchlistBody.addEventListener("click", async (e) => {
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;

      const symbol = btn.dataset.symbol;
      btn.disabled = true;
      resultEl.textContent = "Removing " + symbol + "...";

      try {
        const resp = await fetch(`/watchlist/${encodeURIComponent(symbol)}`, {
          method: "DELETE",
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          btn.disabled = false;
          return;
        }
        resultEl.textContent = "Removed " + data.symbol + " from your watchlist.";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
        btn.disabled = false;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
