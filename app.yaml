command:
  - "python"
  - "app.py"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: MASSIVE_API_BASE_URL
    value: "https://api.massive.com"
  - name: MASSIVE_SECRET_SCOPE
    value: "massive"
  - name: MASSIVE_SECRET_KEY
    value: "api-key"
  # Vector Search Configuration
  - name: VECTOR_SEARCH_ENDPOINT
    value: "stock_app_vs_endpoint"  # Change this to your endpoint name
  - name: VECTOR_SEARCH_INDEX
    value: "main.default.ticker_news_vector_index"  # Change this to your full index name (catalog.schema.index)
